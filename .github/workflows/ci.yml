name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v5

      - name: Install busted and luacheck
        run: |
          luarocks install busted
          luarocks install luacheck

      - name: Fetch embedded libraries
        run: python3 tools/fetch_libs.py

      - name: Lint
        run: luacheck .

      - name: Format
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --check .

      - name: Test
        run: busted

      - name: Validate phrase data
        run: lua tools/validate_data.lua
